name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --noEmit -p tsconfig.node.json
      - run: npm run build:web

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [calibration, sync]
    defaults:
      run:
        working-directory: ${{ matrix.backend }}/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # Only what the tests import. rtmlib, onnxruntime and mediapipe are loaded lazily and are not needed here.
      - name: Install test dependencies
        run: >
          pip install pytest ruff numpy scipy pandas matplotlib opencv-python-headless ezc3d
          fastapi uvicorn python-multipart aiofiles sse-starlette python-dotenv pillow reportlab
      - run: ruff check . --select F,E9
      - run: python -m compileall -q .
      - run: python -m pytest -q

  # The app targets Windows: one job runs the same checks there (both backends' tests and the full Electron build).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend test dependencies
        run: >
          pip install pytest numpy scipy pandas matplotlib opencv-python-headless ezc3d
          fastapi uvicorn python-multipart aiofiles sse-starlette python-dotenv pillow reportlab
      - name: Calibration backend tests
        working-directory: calibration/backend
        run: python -m pytest -q
      - name: Sync backend tests
        working-directory: sync/backend
        run: python -m pytest -q
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
